# Synthetic 5-tile stack (same shape as the NJ DEM stack) for running the whole
# pipeline on a laptop, or as a quick MPI smoke test on a cluster.
#
#   ocsmesh-test data   -c configs/local_synthetic.yaml --validate
#   ocsmesh-test run    -c configs/local_synthetic.yaml --test 1 --mode serial --method exact
#   ocsmesh-test report -c configs/local_synthetic.yaml --figures

name: synthetic
base_dir: ..                 # paths below are relative to the repo root
# OCSMesh checkout to put first on PYTHONPATH in the SLURM scripts (unset = use the
# ocsmesh installed in the conda env). The run summary records which one was imported.
ocsmesh_path: ${OCSMESH_PATH}
results_root: results/synthetic
reports_dir: reports

domain:
  shapefile: dems/synthetic/domain.shp      # written by `data`

dems:
  dir: dems/synthetic
  synthetic: {scale: 1.0}                   # >1 = coarser tiles, faster runs

mesh:
  hmin: 50.0
  hmax: 3000.0
  geom_zmin: -10000.0
  geom_zmax: 10.0
  engine: gmsh
  bnd_representation: adapt

refinements:
  depth_bands:
    - {value: 3000.0, lower: null,  upper: -30.0}
    - {value: 2500.0, lower: -30.0, upper: -25.0}
    - {value: 2000.0, lower: -25.0, upper: -20.0}
    - {value: 1500.0, lower: -20.0, upper: -15.0}
    - {value: 1000.0, lower: -15.0, upper: null}
  contour:
    level: 0.0
    target_size: 300.0
    expansion_rate: 0.005
  flow_limiters:
    - {hmin: 200.0, hmax: 3000.0, lower: -10.0, upper: 0.0}
  channels:
    - {width: 1000.0, target_size: 300.0, expansion_rate: 0.01, tolerance: 20.0}
  topo_bound:
    - {value: 800.0, lower: -10.0, upper: 0.0, value_type: max, rate: null}
  "topo_bound:rate":
    - {value: 800.0, lower: -10.0, upper: 0.0, value_type: max, rate: 0.0002}
  topo_func:
    - {func: {name: depth_linear, a: 50.0, b: 100.0}, lower: -60.0, upper: 0.0, value_type: max, rate: null}
  courant:
    - {upper: 0.9, timestep: 30.0, wave_amplitude: 2.0}
  region_constraints:
    - {shapefile: inputs/synthetic/region.geojson, value: 300.0, value_type: max, rate: 0.0002}
  patches:
    - {shapefile: inputs/synthetic/patch.geojson, target_size: 150.0, expansion_rate: 0.002}
  features:
    - {shapefile: inputs/synthetic/feature_lines.geojson, target_size: 200.0, expansion_rate: 0.002}

tests:
  - {id: 0, name: baseline,    description: "no refinements",            refinements: []}
  - {id: 1, name: depth_bands, description: "5 depth bands",             refinements: [depth_bands]}
  - {id: 2, name: contour,     description: "+ contour",                 refinements: [depth_bands, contour]}
  - {id: 3, name: channels,    description: "channels only",             refinements: [channels]}
  - {id: 4, name: full,        description: "all refinements",           refinements: [depth_bands, contour, flow_limiters, channels]}
  - {id: 10, name: contour_only,      description: "contour only",            refinements: [contour]}
  - {id: 11, name: flow_limiter_only, description: "flow limiter only",       refinements: [flow_limiters]}
  - {id: 12, name: topo_bound,        description: "topo bound, no rate",     refinements: [topo_bound]}
  - {id: 13, name: topo_bound_rate,   description: "topo bound with rate",    refinements: ["topo_bound:rate"]}
  - {id: 14, name: topo_func,         description: "topo function",           refinements: [topo_func]}
  - {id: 15, name: courant,           description: "Courant number",          refinements: [courant]}
  - {id: 16, name: region,            description: "region with rate",        refinements: [region_constraints]}
  - {id: 17, name: patch,             description: "patch",                   refinements: [patches]}
  - {id: 18, name: features,          description: "user line features",      refinements: [features]}

methods: [fast, exact]

modes:
  serial:      {nprocs: 1}
  parallel:    {nprocs: 4}
  mpi_no_pool: {ntasks: 6, cpus_per_task: 1, nodes: 1}   # 5 tiles + 1 manager (cluster only)

cluster:
  walltime: "01:00:00"
  exclusive: false
  launcher: srun
  script_dir: slurm/synthetic
  log_dir: logs/synthetic
