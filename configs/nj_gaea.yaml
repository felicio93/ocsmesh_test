# NJ coastal benchmark on Gaea C6.
#
#   export GEBCO_FILE=/path/to/gebco_2024.tif      # downloaded once from https://download.gebco.net/
#   ocsmesh-test data   -c configs/nj_gaea.yaml --validate
#   ocsmesh-test slurm  -c configs/nj_gaea.yaml --submit
#   ocsmesh-test report -c configs/nj_gaea.yaml --figures
#
# Paths are relative to base_dir (the repo root) unless absolute. ${VAR} expands environment variables.

name: nj
base_dir: ..                 # paths below are relative to the repo root
# OCSMesh checkout to put first on PYTHONPATH in the SLURM scripts (unset = use the
# ocsmesh installed in the conda env). The run summary records which one was imported.
ocsmesh_path: ${OCSMESH_PATH}
results_root: results/nj
reports_dir: reports
report_note: >
  Inputs differ from the October 2026 runs on ticket #1645: GEBCO is one tile cropped
  from GEBCO_FILE (was the STOFS split tiles) and MPI rank counts follow the usable tile
  count, so absolute times are not directly comparable with those 60 runs.

domain:
  shapefile: domain/AOI_domain_FC.shp     # 39.0-40.5 N, 75.0-73.0 W
  buffer_deg: 0.0                            # extra margin for tile selection

dems:
  dir: dems/nj
  tile_selection: polygon       # polygon (correct) | bbox (reproduces the all-nodata-tile bug, N1)
  require_polygon: true         # drop tiles outside the AOI polygon again at run time
  gebco:
    file: ${GEBCO_FILE}
    buffer_deg: 0.5
  ncei:                         # listed low -> high priority; the last source wins where tiles overlap
    - name: ncei_third          # ~10 m
      dataset: NCEI_third_Topobathy_2014_8580
      subfolders: [northeast_sandy]
      tile_size_deg: 0.25
    - name: ncei_ninth          # ~3 m, highest priority
      dataset: NCEI_ninth_Topobathy_2014_8483
      subfolders: [northeast_sandy, chesapeake_bay]
      tile_size_deg: 0.25
  # Resampled / split copies of the NCEI tiles (GEBCO is kept as is), built with
  # `ocsmesh-test variant -c configs/nj_gaea.yaml --variant <name>` and run with
  # `--variant <name>`; results go to results/nj/variants/<name>. Resolutions are
  # fractions of hmin (50 m); never upsampled (the ~10 m third tiles stay at 10 m
  # for res_6m). Split variants have more tiles than ranks: use mpi_19 / mpi_41.
  variants:
    res_6m:        {resample_m: 6.25, resampling: average}     # hmin/8
    res_12m:       {resample_m: 12.5, resampling: average}     # hmin/4
    res_25m:       {resample_m: 25.0, resampling: average}     # hmin/2
    res_50m:       {resample_m: 50.0, resampling: average}     # hmin
    res_12m_min:   {resample_m: 12.5, resampling: min}         # deepest value: keeps creeks open
    res_25m_min:   {resample_m: 25.0, resampling: min}
    split_2x2:     {split: 2}
    split_4x4:     {split: 4}
    split_4x4_ov2km: {split: 4, overlap_m: 2000.0}             # naive overlap >= channel width
    split_8x8:     {split: 8}
    # resampling and splitting combined (resampled first, then split)
    res_6m_split_4x4:  {resample_m: 6.25, resampling: average, split: 4}
    res_12m_split_4x4: {resample_m: 12.5, resampling: average, split: 4}
    res_12m_split_8x8: {resample_m: 12.5, resampling: average, split: 8}
    # OCSMesh resampling (resampling_factor, OCSMesh >= PR B): OCSMesh options on
    # the original DEMs, nothing to build. `hfun` = collector arguments,
    # `refinements` = arguments merged into every item of those blocks.
    rf1:     {hfun: {resampling_factor: 1.0}}                  # 50 m grid
    rf05:    {hfun: {resampling_factor: 0.5}}                  # 25 m
    rf025:   {hfun: {resampling_factor: 0.25}}                 # 12.5 m
    rf0125:  {hfun: {resampling_factor: 0.125}}                # 6.25 m
    rf05_min: {hfun: {resampling_factor: 0.5, resampling_method: min}}
    # coarse grid, detection / slopes on the native DEM
    rf05_native: {hfun: {resampling_factor: 0.5},
                  refinements: {contour: {resampling_factor: native},
                                flow_limiters: {resampling_factor: native},
                                "flow_limiters:hmin": {resampling_factor: native}}}
    rf1_native:  {hfun: {resampling_factor: 1.0},
                  refinements: {contour: {resampling_factor: native},
                                flow_limiters: {resampling_factor: native},
                                "flow_limiters:hmin": {resampling_factor: native}}}
    # same DEMs as another variant, own results folder: reruns with an OCSMesh
    # fix checkout (OCSMESH_PATH=... ocsmesh-test slurm ...)
    split_4x4_fp: {dems_from: split_4x4}        # composite footprint fix
    split_8x8_ch: {dems_from: split_8x8}        # get_polygon_channels fix
    # channel detection only (grid stays native)
    ch0125:  {refinements: {channels: {resampling_factor: 0.125}}}
    ch025:   {refinements: {channels: {resampling_factor: 0.25}}}
    # channels detected on 6.25 m pixels, sizes on a coarse grid
    ch0125_rf05: {hfun: {resampling_factor: 0.5},
                  refinements: {channels: {resampling_factor: 0.125}}}
    ch0125_rf1:  {hfun: {resampling_factor: 1.0},
                  refinements: {channels: {resampling_factor: 0.125}}}

mesh:
  hmin: 50.0
  hmax: 3000.0
  geom_zmin: -10000.0
  geom_zmax: 10.0
  engine: gmsh
  bnd_representation: adapt

refinements:
  depth_bands:                  # add_constant_value
    - {value: 3000.0, lower: null,  upper: -30.0}
    - {value: 2500.0, lower: -30.0, upper: -25.0}
    - {value: 2000.0, lower: -25.0, upper: -20.0}
    - {value: 1500.0, lower: -20.0, upper: -15.0}
    - {value: 1000.0, lower: -15.0, upper: null}
  contour:                      # add_contour
    level: 0.0
    target_size: 200.0
    expansion_rate: 0.001
  flow_limiters:                # add_subtidal_flow_limiter
    - {hmin: 100.0, hmax: 3000.0, lower: -10.0,  upper: 0.0}
    - {hmin: 500.0, hmax: 3000.0, lower: -100.0, upper: -10.0}
  "flow_limiters:hmin":         # same limiters, flat cells (zero slope) -> limiter hmin (OCSMesh default)
    - {hmin: 100.0, hmax: 3000.0, lower: -10.0,  upper: 0.0, flat_areas: hmin}
    - {hmin: 500.0, hmax: 3000.0, lower: -100.0, upper: -10.0, flat_areas: hmin}
  "flow_limiters:keep":         # same limiters, flat cells keep their size
    - {hmin: 100.0, hmax: 3000.0, lower: -10.0,  upper: 0.0, flat_areas: keep}
    - {hmin: 500.0, hmax: 3000.0, lower: -100.0, upper: -10.0, flat_areas: keep}
  channels:                     # add_channel; tolerance=null means no polygon simplification
    - {width: 2000.0, target_size: 500.0, expansion_rate: 0.01, tolerance: null}
  # Blocks for the per-refinement profiling tests (10-18). Constraint rates are per
  # metre (UTM): rate 0.0002 spreads a constraint over ~5 km, across tile edges.
  topo_bound:                   # add_topo_bound_constraint, cap 800 m in -10..0 m
    - {value: 800.0, lower: -10.0, upper: 0.0, value_type: max, rate: null}
  "topo_bound:rate":            # same, relaxed with distance outside the band
    - {value: 800.0, lower: -10.0, upper: 0.0, value_type: max, rate: 0.0002}
  topo_func:                    # add_topo_func_constraint, cap 50 m per m of depth + 100 m
    - {func: {name: depth_linear, a: 50.0, b: 100.0}, lower: -60.0, upper: 0.0, value_type: max, rate: null}
  courant:                      # add_courant_num_constraint
    - {upper: 0.9, timestep: 30.0, wave_amplitude: 2.0}
  region_constraints:           # add_region_constraint, Barnegat Bay box
    - {shapefile: inputs/nj/region.geojson, value: 300.0, value_type: max, rate: 0.0002}
  patches:                      # add_patch, Great Bay box
    - {shapefile: inputs/nj/patch.geojson, target_size: 150.0, expansion_rate: 0.002}
  features:                     # add_feature, three user lines (river, inlet, offshore track)
    - {shapefile: inputs/nj/feature_lines.geojson, target_size: 200.0, expansion_rate: 0.002}

tests:
  - {id: 0, name: baseline,     description: "no refinements, hmax everywhere",        refinements: []}
  - {id: 1, name: depth_bands,  description: "5 depth bands",                           refinements: [depth_bands]}
  - {id: 2, name: contour,      description: "+ shoreline contour",                     refinements: [depth_bands, contour]}
  - {id: 3, name: flow_limiter, description: "+ 2 flow limiters",                       refinements: [depth_bands, contour, flow_limiters]}
  - {id: 4, name: channels,     description: "channels only",                           refinements: [channels]}
  - {id: 5, name: full,         description: "all refinements",                         refinements: [depth_bands, contour, flow_limiters, channels]}
  # flow limiter flat_areas option (OCSMesh >= the flat_areas commit); test 3 with the option explicit
  - {id: 6, name: flow_limiter_hmin, description: "test 3, flat cells -> limiter hmin", refinements: [depth_bands, contour, "flow_limiters:hmin"]}
  - {id: 7, name: flow_limiter_keep, description: "test 3, flat cells keep their size", refinements: [depth_bands, contour, "flow_limiters:keep"]}
  # Gmsh 'adapt' boundary spacing = size function x bnd_factor (same size function, only the mesh differs)
  - {id: 8, name: bnd_factor_1,   description: "test 6, bnd_factor 1.0 (default)", refinements: [depth_bands, contour, "flow_limiters:hmin"], mesh_options: {bnd_factor: 1.0}}
  - {id: 9, name: bnd_factor_1_5, description: "test 6, bnd_factor 1.5",           refinements: [depth_bands, contour, "flow_limiters:hmin"], mesh_options: {bnd_factor: 1.5}}
  # One refinement per test, for profiling and for scoring resampling/splitting per
  # refinement (with tests 1 depth_bands and 4 channels; test 5 is the combination).
  - {id: 10, name: contour_only,      description: "shoreline contour only",            refinements: [contour]}
  - {id: 11, name: flow_limiter_only, description: "2 flow limiters only",              refinements: ["flow_limiters:hmin"]}
  - {id: 12, name: topo_bound,        description: "topo bound constraint, no rate",    refinements: [topo_bound]}
  - {id: 13, name: topo_bound_rate,   description: "topo bound constraint with rate",   refinements: ["topo_bound:rate"]}
  - {id: 14, name: topo_func,         description: "topo function constraint",          refinements: [topo_func]}
  - {id: 15, name: courant,           description: "Courant number constraint",         refinements: [courant]}
  - {id: 16, name: region,            description: "region constraint with rate",       refinements: [region_constraints]}
  - {id: 17, name: patch,             description: "patch (Great Bay)",                 refinements: [patches]}
  - {id: 18, name: features,          description: "3 user line features",              refinements: [features]}

methods: [fast, exact]

# ntasks: auto = one worker rank per usable tile (after the AOI and valid-data
# filters) + the manager; resolved from the manifest when the scripts are written.
modes:
  serial:        {nprocs: 1}
  parallel:      {nprocs: 40}
  mpi_no_pool:   {ntasks: auto, cpus_per_task: 1, nodes: 1}
  mpi_hybrid:    {ntasks: 6,    cpus_per_task: 7, nodes: 1}
  mpi_multinode: {ntasks: auto, cpus_per_task: 1, nodes: 2}
  mpi_19:        {ntasks: 19,   cpus_per_task: 1, nodes: 1}   # fixed rank counts, for split variants
  mpi_41:        {ntasks: 41,   cpus_per_task: 1, nodes: 1}
  mpi_81:        {ntasks: 81,   cpus_per_task: 1, nodes: 2}   # split variants across 2 nodes

cluster:                        # Gaea C6
  account: nos-surge
  partition: batch
  qos: normal
  clusters: c6
  walltime: "16:00:00"
  exclusive: true
  mail_user: ${OCSMESH_TEST_EMAIL}   # dropped when the variable is not set
  modules: [PrgEnv-intel]
  env:
    LD_LIBRARY_PATH: "${CRAY_LD_LIBRARY_PATH}:${LD_LIBRARY_PATH}"
    FI_CXI_DEFAULT_CQ_SIZE: "1048576"
    FI_CXI_OFLOW_BUF_SIZE: "8388608"
    FI_CXI_RX_MATCH_MODE: software
  conda_sh: /ncrc/proj/nos-surge/Felicio.Cassalho/miniconda3/etc/profile.d/conda.sh
  conda_env: ocsmesh_mpi_test
  launcher: srun
  launcher_args: --cpu-bind=cores
  script_dir: slurm/nj
  log_dir: logs/nj
